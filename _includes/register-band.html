<!-- Reusable end-of-page CTA — one wording, one trigger, one place to
     change it: _data/register_band.yml. See _includes/register-modal.html
     for the form itself. -->
<div class="register-band">
  <div class="register-band-text">
    <h2>{{ site.data.register_band.heading }}</h2>
    <p>{{ site.data.register_band.body }}</p>
  </div>
  <div class="register-band-action">
    <a href="{{ site.data.site.qualtrics_form_url }}" class="btn btn--primary js-register-open" target="_blank" rel="noopener">{{ site.data.register_band.cta }}</a>
    <span>{{ site.data.register_band.note }}</span>
  </div>
</div>
