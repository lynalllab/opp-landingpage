<div class="features-grid">
  {% for feature in site.data.features %}
  <div class="feature-card reveal {% cycle 'reveal', 'reveal reveal--delay-1', 'reveal reveal--delay-2' %}">
    <div class="feature-icon" aria-hidden="true">

      {% if feature.icon == "molecule" %}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="2.5"/>
        <circle cx="4.5" cy="6" r="2"/>
        <circle cx="19.5" cy="6" r="2"/>
        <circle cx="4.5" cy="18" r="2"/>
        <circle cx="19.5" cy="18" r="2"/>
        <line x1="12" y1="9.5" x2="6" y2="7.2"/>
        <line x1="12" y1="9.5" x2="18" y2="7.2"/>
        <line x1="12" y1="14.5" x2="6" y2="16.8"/>
        <line x1="12" y1="14.5" x2="18" y2="16.8"/>
      </svg>

      {% elsif feature.icon == "shield" %}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L3 7v6c0 5.1 3.8 9.9 9 11 5.2-1.1 9-5.9 9-11V7L12 2z"/>
        <polyline points="9 12 11 14 15 10"/>
      </svg>

      {% elsif feature.icon == "people" %}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="7" r="3"/>
        <path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
        <path d="M16 3.1a4 4 0 0 1 0 7.8"/>
        <path d="M21 21v-2a4 4 0 0 0-3-3.87"/>
      </svg>
      {% endif %}

    </div>
    <h3>{{ feature.heading }}</h3>
    <p>{{ feature.description }}</p>
  </div>
  {% endfor %}
</div>
