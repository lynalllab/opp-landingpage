about:
  heading: "What is the Open Psychiatry Project?"
  lead: "The Open Psychiatry Project is a &pound;2.3M initiative building the UK&rsquo;s first open, publicly accessible resource for exploring how genes, cells, and molecules influence mental health conditions."
  paragraphs:
    - "Led by Dr Mary-Ellen Lynall at the University of Cambridge in partnership with Dr Ellen McDonagh at EMBL-EBI, the project extends the globally used Open Targets resource &mdash; a major hub for drug and target discovery &mdash; to integrate a wide range of mental-health&ndash;relevant molecular datasets."
    - "The project also involves establishing links between existing UK mental health patient cohorts, to enable a safe, federated data analysis framework to unify these valuable resources and glean new insights into the biology of mental health using real world data. This will ultimately feed into enhancing the Open Targets resource to provide evidence of potential biomarkers, drug targets, and treatments for mental health conditions."
    - "Our interactive website will become the hub for mental health - presenting links to these resources and clear, accessible information designed for everyone: researchers advancing the science, clinicians seeking new insights, industry partners identifying opportunities, and people with direct lived experience of mental illness"
    - "Our goal is to speed up the discovery of better, more personalised treatments for mental health conditions."
  callout: "Mental health biomarker data is currently fragmented across many resources and secure environments, making it difficult to assess how genes and molecules affect mental health. This project changes that."

