# ===================================================================
# FAQs
# Single source of truth for the FAQ accordion on get-involved.html
# (the "FAQs" section of /get-involved/). Edit questions and answers
# here, no HTML needed.
#
# Structure: a flat list of questions, shown in the order below.
#   question: the FAQ question
#   answer:   the answer. Plain text is fine — leave a blank line
#             between paragraphs, use [link text](https://example.com)
#             for a link, and **text** for bold.
#
# The "What would I do?" question is special: instead of "answer" it
# has "projects: true" plus an "intro" line, which pulls in the project
# breakdown from _data/faq_projects.yml (edit that file to change
# those details).
#
# Questions parked for a future /good-experience/ page live in
# _data/good_experience_faqs.yml and are not rendered anywhere yet.
# ===================================================================

- question: "Why are we doing this co-production?"
  answer: >
    We want to design a digital tool that helps the public, researchers, and patients easily
    explore mental health data. Instead of experts building something in isolation, we want to
    build it with you so that it actually answers the questions you care about, in plain
    language that makes sense.

- question: "What would I do?"
  projects: true
  intro: "We have divided the main tasks into 3 different projects:"

- question: "How much time is required?"
  answer: >
    The tasks we would like help with run over discrete time periods. We are recruiting to a
    network and will call upon people to respond at different times during the project. We
    estimate that each task would take the form of a half day workshop with 2-3 follow-up
    meetings.

- question: "How will I know what difference my input made?"
  answer: >
    We keep a project-wide impact register that logs the suggestions and ideas that came from
    people with lived experience and what happened as a result: whether that's a change we
    made, a change still in progress, or something we weren't able to take forward and why.
    We'll share this back with the group regularly, so there's always a visible line from what
    you said to what we did.

- question: "Will I get paid?"
  answer: >
    Your involvement can be voluntary or paid — the choice is yours. For paid involvement, we
    follow the
    [NIHR public contributor reward policy](https://www.nihr.ac.uk/about-us/who-we-are/policies-and-guidelines/public-contributor-reward-policy/payment-public-considering-involvement)
    and offer £27.50/hour, based on the time and preparation each task requires, paid by bank
    transfer. Most sessions will be held online, though we hope to include at least one
    in-person workshop, and we will cover any out-of-pocket expenses for attending.
