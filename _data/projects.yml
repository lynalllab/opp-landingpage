- years: "2026–2027"
  title: "Conversations with science"
  subtitle: "Helping AI to unlock the biology of mental health for public understanding."
  task: "You will help us decide what people actually want to ask about the biology of mental health, test early AI prototypes, and define what a “good, trustworthy, and understandable answer” looks like."

- years: "2027–2028"
  title: "Clues in the records"
  subtitle: "Deciding what matters most in hospital & GP data."
  task: "You will review types of real-world health data (from prescription histories to hospital admissions) and help prioritize which specific measures are meaningful enough to invest time in unlocking."

- years: "2029"
  title: "The Co-Pilot Study"
  subtitle: "Leading a team-based mental health analysis, with questions driven by lived experience."
  task: "You will join a collaborative team to pitch research ideas, design a custom study protocol, and test run the secure analysis on the resource."
